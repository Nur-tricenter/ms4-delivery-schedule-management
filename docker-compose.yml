services:
  postgres:
    image: postgres:17-alpine
    container_name: delivery-schedule-management-postgres
    environment:
      - POSTGRES_DB=delivery_schedule_management
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d delivery_schedule_management"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: delivery-schedule-management-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__delivery-schedule-management-db=Host=postgres;Port=5432;Database=delivery_schedule_management;Username=admin;Password=password
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
